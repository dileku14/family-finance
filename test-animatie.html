<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test animație • Academia Banilor</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#183b31;color:#fff}.wrap{max-width:760px;margin:auto;padding:12px}h1{font-size:22px;text-align:center}.stage{position:relative;overflow:hidden;aspect-ratio:4/5;max-height:75vh;border:5px solid #f3c96b;border-radius:22px;background:linear-gradient(#a8d7f2 0%,#e6f3c0 56%,#75b66b 57%,#32764d 100%)}.sun{position:absolute;top:7%;right:10%;width:65px;height:65px;background:#ffdf7e;border-radius:50%;box-shadow:0 0 60px #ffecab}.tree{position:absolute;bottom:24%;font-size:clamp(90px,25vw,170px);filter:drop-shadow(0 7px 3px #315d4a88)}.t1{left:-10%}.t2{right:-10%}.school{position:absolute;left:24%;top:19%;width:52%;text-align:center;font-size:clamp(60px,19vw,135px)}.owl,.fox{position:absolute;bottom:12%;width:36%;height:39%;transform-origin:50% 90%;filter:drop-shadow(0 10px 8px #244f3588)}.owl{left:9%;animation:owlFloat 2.5s ease-in-out infinite}.fox{right:7%;animation:foxEnter 2s ease-out both,foxHop 1.3s ease-in-out 2s infinite}.head{position:absolute;top:9%;left:10%;width:80%;height:54%;border-radius:48% 48% 43% 43%;background:#ad7853;border:4px solid #73482c}.owl .ears:before,.owl .ears:after{content:"";position:absolute;top:0;width:30%;height:27%;background:#ad7853;border-radius:8px 100% 0 0;transform:rotate(-20deg)}.owl .ears:before{left:9%}.owl .ears:after{right:9%;transform:rotate(20deg) scaleX(-1)}.eyes{position:absolute;top:32%;left:16%;width:68%;display:flex;justify-content:space-between}.eye{width:42%;aspect-ratio:1;background:#fff6dc;border-radius:50%;border:3px solid #5b402f;position:relative;animation:blink 5s infinite}.eye:after{content:"";position:absolute;top:27%;left:38%;width:35%;height:42%;border-radius:50%;background:#2d2825}.beak{position:absolute;top:65%;left:44%;width:16%;height:16%;background:#f4b13f;clip-path:polygon(0 0,100% 0,50% 100%)}.body{position:absolute;bottom:0;left:20%;width:60%;height:48%;background:#90613f;border-radius:50% 50% 42% 42%;border:4px solid #73482c}.belly{position:absolute;left:20%;top:18%;width:60%;height:65%;border-radius:50%;background:#f5d4a2}.wing{position:absolute;top:53%;width:26%;height:32%;border-radius:50%;background:#a9744e;border:3px solid #73482c}.wing.left{left:4%;transform-origin:100% 0;animation:flap 1.7s infinite}.wing.right{right:4%;transform-origin:0 0;animation:flapR 1.7s infinite}.fox .head{background:#ec843d;top:13%;border-color:#a64c27}.fox .ears:before,.fox .ears:after{content:"";position:absolute;top:1%;width:33%;height:32%;background:#ec843d;clip-path:polygon(50% 0,100% 100%,0 100%)}.fox .ears:before{left:10%}.fox .ears:after{right:10%}.fox .body{background:#e7833e;border-color:#a64c27}.fox .belly{background:#fff2da}.fox .eye{width:39%;background:#fff5dc}.fox .nose{position:absolute;top:67%;left:43%;width:16%;height:12%;border-radius:50%;background:#302820}.tail{position:absolute;bottom:4%;right:-15%;width:48%;height:23%;background:#e7833e;border-radius:70% 20% 60% 20%;border:3px solid #a64c27;transform-origin:0 50%;animation:tail 1s infinite alternate}.coins{position:absolute;right:10%;bottom:5%;font-size:35px;animation:shine 1s infinite alternate}.dialog{position:absolute;top:3%;left:5%;width:90%;background:#fffdf3;color:#273f32;border:3px solid #d1a652;border-radius:18px;padding:12px 14px;min-height:84px;font-size:clamp(16px,4vw,22px);font-weight:700;text-align:center;box-shadow:0 5px 10px #0002}.controls{display:flex;gap:10px;margin-top:12px}.controls button{flex:1;padding:16px 8px;border:0;border-radius:15px;background:#ffcf69;color:#2d382d;font-weight:800;font-size:16px}.controls button:disabled{opacity:.5}.note{font-size:14px;line-height:1.5;color:#e0efdd;text-align:center}@keyframes owlFloat{50%{transform:translateY(-9px)}}@keyframes foxEnter{from{transform:translateX(180%) rotate(8deg)}to{transform:translateX(0)}}@keyframes foxHop{50%{transform:translateY(-12px) rotate(-3deg)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}@keyframes flap{50%{transform:rotate(-30deg)}}@keyframes flapR{50%{transform:rotate(30deg)}}@keyframes tail{to{transform:rotate(20deg)}}@keyframes shine{to{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){*{animation-duration:3s!important}}</style></head><body><div class="wrap"><h1>🦉 Secretul lui Bani — Scena 1</h1><div class="stage" aria-label="Bani, bufnița, și Vixi, vulpița, se mișcă într-o pădure"><div class="sun"></div><div class="tree t1">🌳</div><div class="tree t2">🌲</div><div class="school">🏡</div><div class="owl"><div class="ears"></div><div class="body"><div class="belly"></div></div><div class="wing left"></div><div class="wing right"></div><div class="head"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="beak"></div></div></div><div class="fox"><div class="tail"></div><div class="ears"></div><div class="body"><div class="belly"></div></div><div class="head"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="nose"></div></div><div class="coins">🪙</div></div><div class="dialog" id="dialog">🦉 Bani: Salut, prieteni! Eu sunt Bani și vă invit în Academia Banilor!</div></div><div class="controls"><button id="sound">🔊 Ascultă dialogul</button><button id="again">↻ Reia scena</button></div><p class="note" id="status">Mișcarea pornește automat. Pentru voce, atinge „Ascultă dialogul” — iPhone cere acest gest pentru sunet.</p></div><script>const lines=[{name:"Bani",text:"Salut, prieteni! Eu sunt Bani și vă invit în Academia Banilor!"},{name:"Vixi",text:"Bună, Bani! Uite, am zece monede! Ce pot face cu ele?"}];let index=0;const dialog=document.getElementById('dialog'),status=document.getElementById('status');function render(){dialog.textContent=(index===0?'🦉 ':'🦊 ')+lines[index].name+': '+lines[index].text}function narrate(){if(!('speechSynthesis' in window)){status.textContent='Vocea nu este disponibilă aici, dar animația continuă.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lines[index].text);u.lang='ro-RO';u.rate=.86;u.onend=()=>{if(index===0){index=1;render();setTimeout(narrate,350)}else status.textContent='Scena s-a încheiat. Poți reasculta sau relua animația.'};u.onerror=()=>{status.textContent='Safari nu a putut reda vocea; animația rămâne disponibilă.'};speechSynthesis.speak(u)}document.getElementById('sound').addEventListener('click',()=>{index=0;render();status.textContent='Se redă povestea…';narrate()});document.getElementById('again').addEventListener('click',()=>{if('speechSynthesis' in window)speechSynthesis.cancel();index=0;render();const fox=document.querySelector('.fox');fox.style.animation='none';void fox.offsetWidth;fox.style.animation='';status.textContent='Scena a fost reluată. Mișcarea funcționează fără sunet.'});setTimeout(()=>{if(index===0){index=1;render()}},4500);</script></body></html>
