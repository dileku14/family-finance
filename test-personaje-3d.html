<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244a35"><title>Secretul lui Bani • Poveste</title><style>*{box-sizing:border-box}body{margin:0;background:#173c2c;color:#fff;font-family:system-ui,-apple-system,sans-serif}.page{max-width:780px;margin:auto;padding:12px}.scene{position:relative;border:4px solid #d5ac60;border-radius:22px;overflow:hidden;background:#274d33;box-shadow:0 10px 30px #0006}.scene img{display:block;width:100%;height:auto}.curtain{position:absolute;top:0;bottom:0;background:#23492d;opacity:1;transition:opacity 1.4s ease;pointer-events:none}.curtain.vixi{right:0;width:34%;background:linear-gradient(90deg,transparent,#23492d 32%)}.curtain.nuci{left:0;width:28%;background:linear-gradient(270deg,transparent,#23492d 35%)}.curtain.reveal{opacity:0}.dialog{margin:14px 0;background:#fff8e8;color:#273a2a;border-radius:18px;padding:16px;min-height:110px;font-size:clamp(18px,4.4vw,23px);line-height:1.45;box-shadow:0 6px 20px #0003}.speaker{font-weight:800;color:#9c612c;margin-bottom:6px}.progress{font-size:13px;text-align:center;color:#dbe9d4}.cta{display:block;margin:14px auto 24px;background:#f8c85b;color:#283b2b;border:0;border-radius:40px;padding:18px 28px;font-size:21px;font-weight:900;text-decoration:none;text-align:center;box-shadow:0 6px 0 #b8862e;max-width:380px}.hidden{display:none!important}.audiohelp{font-size:14px;text-align:center;color:#f7e2a9;margin:10px auto}.audiohelp:empty{display:none}@media(max-width:480px){.page{padding:8px}.scene{border-radius:15px}.dialog{padding:13px}}</style></head><body><main class="page"><div class="scene"><img src="./personaje-3d.png" alt="Bani, Vixi și Nuci în fața Academiei Banilor"><div id="vixiCurtain" class="curtain vixi"></div><div id="nuciCurtain" class="curtain nuci"></div></div><div class="dialog" aria-live="polite"><div id="speaker" class="speaker">🦉 Bani</div><div id="line">Bun venit în Academia Banilor!</div></div><div class="progress" id="progress"></div><div class="audiohelp" id="audiohelp"></div><a id="adventure" class="cta hidden" href="./academia.html">🌟 Începe aventura!</a></main><script>(function(){const scenes=[['Bani','Bun venit în Academia Banilor! Eu sunt Bani, bufnița care te va însoți într-o aventură plină de descoperiri.'],['Bani','Banii ne ajută să cumpărăm lucrurile de care avem nevoie. Dar nu toate dorințele trebuie îndeplinite imediat.'],['Bani','Când primim bani, putem alege să cheltuim o parte și să păstrăm o parte pentru un vis important. Asta se numește economisire.'],['Vixi','Bună, Bani! Eu sunt Vixi! Am zece monede și aș vrea să cumpăr toate dulciurile din magazin!'],['Bani','Vixi, înainte să cheltuiești, întreabă-te: am nevoie de asta sau doar îmi doresc acum?'],['Nuci','Eu sunt Nuci! Strâng câte puțin pentru o bicicletă. Fiecare monedă economisită mă apropie de visul meu!'],['Vixi','Acum înțeleg! Pot să mă bucur de câteva monede și să păstrez restul pentru mai târziu.'],['Bani','Exact! În Academia Banilor vom învăța să facem alegeri istețe, să economisim și să avem grijă de banii noștri.'],['Bani','Tu ești pregătit să începi aventura?']];let i=0,active=false,finished=false;const speaker=document.getElementById('speaker'),line=document.getElementById('line'),progress=document.getElementById('progress'),help=document.getElementById('audiohelp'),cta=document.getElementById('adventure');function display(){let s=scenes[i];speaker.textContent=({Bani:'🦉 ',Vixi:'🦊 ',Nuci:'🐿️ '}[s[0]]||'')+s[0];line.textContent=s[1];progress.textContent='Povestea • '+(i+1)+' / '+scenes.length;if(i>=3)document.getElementById('vixiCurtain').classList.add('reveal');if(i>=5)document.getElementById('nuciCurtain').classList.add('reveal')}function end(){finished=true;active=false;cta.classList.remove('hidden');help.textContent=''}function next(){if(i<scenes.length-1){i++;play()}else end()}function play(){if(finished)return;display();if(!('speechSynthesis' in window)){help.textContent='Vocea nu este disponibilă. Povestea continuă pe ecran.';setTimeout(next,Math.max(4000,scenes[i][1].length*65));return}let u=new SpeechSynthesisUtterance(scenes[i][1]);u.lang='ro-RO';u.rate=.88;u.pitch=scenes[i][0]==='Vixi'?1.25:scenes[i][0]==='Nuci'?1.13:.95;let started=false,done=false;u.onstart=()=>{started=true;active=true;help.textContent=''};u.onend=()=>{if(done)return;done=true;setTimeout(next,450)};u.onerror=()=>{if(done)return;done=true;active=false;help.textContent='Atinge o dată ecranul pentru a porni povestea cu sunet.'};try{speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){help.textContent='Atinge o dată ecranul pentru sunet.'}setTimeout(()=>{if(!started&&!done&&!finished)help.textContent='Dacă nu se aude vocea, atinge o dată ecranul.'},1600)}document.addEventListener('pointerdown',()=>{if(!finished&&!active){play()}},{passive:true});window.addEventListener('load',()=>setTimeout(play,500),{once:true});display()})();</script></body></html>
