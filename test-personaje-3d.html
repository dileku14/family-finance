<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24432f"><title>Secretul lui Bani – Academia Banilor</title><style>*{box-sizing:border-box}body{margin:0;background:#193d2d;color:#fff;font-family:system-ui,-apple-system,sans-serif}.page{max-width:760px;margin:auto;padding:10px}.frame{position:relative;overflow:hidden;border-radius:18px;border:3px solid #d9b76e;box-shadow:0 10px 30px #0005}.frame img{display:block;width:100%;height:auto}.scene{display:none}.frame.story .intro{display:none}.frame.story .scene{display:block}.frame.story .scene img{animation:arrive 1.4s ease-out both}.intro img{width:100%}.caption{margin:12px 0;background:#fff9e9;color:#2c3a2b;border-radius:18px;padding:16px 18px;min-height:104px;font-size:clamp(18px,4.4vw,22px);line-height:1.48}.caption b{display:block;color:#98601f;margin-bottom:6px}.footer{font-size:13px;color:#e3ebd9;text-align:center;min-height:28px}.go{display:block;text-decoration:none;text-align:center;margin:14px auto 24px;padding:18px;background:linear-gradient(#55d83b,#168c27);border:3px solid #b5f07d;color:white;font-size:22px;font-weight:900;border-radius:36px;max-width:370px;box-shadow:0 5px 0 #0c5d19}.hidden{display:none!important}.cover{position:absolute;left:12%;right:12%;bottom:1%;height:11%;background:#efe2b6;opacity:0;pointer-events:none}.intro .cover{opacity:0} @keyframes arrive{from{opacity:.35;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="page"><div id="frame" class="frame"><div class="intro"><img src="./academia-intro.png" alt="Bun venit în Academia Banilor! Secretul lui Bani"></div><div class="scene"><img src="./personaje-3d.png" alt="Bani, Vixi și Nuci în fața Academiei Banilor"></div></div><div class="caption" aria-live="polite"><b id="who">Povestitorul</b><span id="line">Într-un sat vesel, unde fiecare monedă avea o poveste, trăia o bufniță înțeleaptă pe nume Bani.</span></div><div class="footer" id="status"></div><a href="./academia.html" id="go" class="go hidden">▶ Începe aventura!</a></main><script>(function(){const story=[{who:'Povestitorul',text:'Într-un sat vesel, unde fiecare monedă avea o poveste, trăia o bufniță înțeleaptă pe nume Bani.'},{who:'Povestitorul',text:'În fiecare zi, Bani îi învăța pe prietenii săi, Vixi, vulpița curioasă, și Nuci, veverița grijulie, cum să aibă grijă de bani și să ia decizii înțelepte.'},{who:'Povestitorul',text:'Acum, Bani te invită și pe tine într-o aventură plină de descoperiri. Vei învăța, vei rezolva provocări și vei câștiga stele pentru alegerile tale.'},{who:'Bani',text:'Salut, prieteni! Eu sunt Bani. Bine ați venit în Academia Banilor! Aici învățăm să deosebim ce ne trebuie de ceea ce ne dorim.'},{who:'Vixi',text:'Bună, Bani! Eu am zece monede și aș vrea să cumpăr toate dulciurile din magazin!'},{who:'Bani',text:'Vixi, putem cheltui o parte, dar este bine să păstrăm și pentru lucrurile importante. Asta înseamnă să economisim.'},{who:'Nuci',text:'Eu strâng câte puțin pentru o bicicletă! Fiecare monedă economisită mă apropie de visul meu.'},{who:'Vixi',text:'Atunci voi păstra și eu câteva monede pentru mai târziu!'},{who:'Bani',text:'Foarte bine! Aici vom învăța prin povești și jocuri cum să facem alegeri înțelepte. Tu ești pregătit să începi aventura?'}];let i=0,serial=0,finished=false,voiceStarted=false;const frame=document.getElementById('frame'),who=document.getElementById('who'),line=document.getElementById('line'),status=document.getElementById('status'),go=document.getElementById('go');function finish(){finished=true;go.classList.remove('hidden');status.textContent='Povestea s-a încheiat.'}function show(){who.textContent=story[i].who;line.textContent=story[i].text;if(i>=3)frame.classList.add('story')}function advance(){if(finished)return;if(i===story.length-1){finish();return}i++;speak()}function speak(){if(finished)return;show();const id=++serial;if(!('speechSynthesis' in window)){status.textContent='Povestea continuă pe ecran.';setTimeout(()=>{if(id===serial)advance()},Math.max(3600,story[i].text.length*66));return}let u=new SpeechSynthesisUtterance(story[i].text);u.lang='ro-RO';u.rate=.88;u.pitch=story[i].who==='Povestitorul'?.95:story[i].who==='Vixi'?1.22:story[i].who==='Nuci'?1.12:1;let started=false,ended=false;u.onstart=()=>{started=true;voiceStarted=true;status.textContent=''};u.onend=()=>{if(ended||id!==serial)return;ended=true;setTimeout(()=>{if(id===serial)advance()},500)};u.onerror=()=>{if(ended||id!==serial)return;ended=true;status.textContent='Pentru a auzi povestea, atinge o dată ecranul.'};try{speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){status.textContent='Atinge o dată ecranul pentru sunet.'}setTimeout(()=>{if(!started&&!ended&&id===serial)status.textContent='Dacă nu se aude vocea, atinge o dată ecranul.'},1800)}document.addEventListener('pointerdown',function(){if(!finished&&!voiceStarted){speak()}},{passive:true});window.addEventListener('load',()=>setTimeout(speak,400),{once:true});show()})();</script></body></html>
