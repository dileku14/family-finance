<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24432f"><title>Secretul lui Bani – Academia Banilor</title><style>*{box-sizing:border-box}body{margin:0;background:#193d2d;color:#fff;font-family:system-ui,-apple-system,sans-serif}.page{max-width:760px;margin:auto;padding:10px}.frame{position:relative;overflow:hidden;border-radius:18px;border:3px solid #d9b76e;box-shadow:0 10px 30px #0005}.frame img{display:block;width:100%;height:auto}.scene{display:none}.frame.story .intro{display:none}.frame.story .scene{display:block}.frame.story .scene img{animation:arrive 1.4s ease-out both}.intro{height:auto;aspect-ratio:1 / .87;overflow:hidden;position:relative}.intro img{width:100%;height:auto}.intro:after{content:"";position:absolute;inset:auto 0 0;height:2%;background:linear-gradient(transparent,#274d33);pointer-events:none}.caption{margin:12px 0;background:#fff9e9;color:#2c3a2b;border-radius:18px;padding:16px 18px;min-height:104px;font-size:clamp(18px,4.4vw,22px);line-height:1.48}.caption b{display:block;color:#98601f;margin-bottom:6px}.footer{font-size:13px;color:#e3ebd9;text-align:center;min-height:28px}.go{display:block;text-decoration:none;text-align:center;margin:14px auto 24px;padding:18px;background:linear-gradient(#55d83b,#168c27);border:3px solid #b5f07d;color:white;font-size:22px;font-weight:900;border-radius:36px;max-width:370px;box-shadow:0 5px 0 #0c5d19}.hidden{display:none!important}.cover{position:absolute;left:12%;right:12%;bottom:1%;height:11%;background:#efe2b6;opacity:0;pointer-events:none}.intro .cover{opacity:0} @keyframes arrive{from{opacity:.35;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="page"><div id="frame" class="frame"><div class="intro"><img src="./academia-intro.png" alt="Bun venit în Academia Banilor!"></div><div class="scene"><img src="./personaje-3d.png" alt="Bani, Vixi și Nuci în fața Academiei Banilor"></div></div><div class="caption" aria-live="polite"><b id="who">Povestitorul</b><span id="line">Într-un sat vesel, unde fiecare monedă avea o poveste, trăia o bufniță înțeleaptă pe nume Bani.</span></div><div class="footer" id="status">Atinge imaginea pentru a porni povestea cu voce.</div><a href="./academia.html" id="go" class="go hidden">▶ Începe aventura!</a></main><script>(function(){const story=[{who:'Povestitorul',text:'Într-un sat vesel, unde fiecare monedă avea o poveste, trăia o bufniță înțeleaptă pe nume Bani.'},{who:'Povestitorul',text:'În fiecare zi, Bani îi învăța pe prietenii săi, Vixi, vulpița curioasă, și Nuci, veverița grijulie, cum să aibă grijă de bani și să ia decizii înțelepte.'},{who:'Povestitorul',text:'Acum, Bani te invită și pe tine într-o aventură plină de descoperiri. Vei învăța, vei rezolva provocări și vei câștiga stele pentru alegerile tale.'},{who:'Bani',text:'Salut, prieteni! Eu sunt Bani. Bine ați venit în Academia Banilor! Aici învățăm să deosebim ce ne trebuie de ceea ce ne dorim.'},{who:'Vixi',text:'Bună, Bani! Eu am zece monede și aș vrea să cumpăr toate dulciurile din magazin!'},{who:'Bani',text:'Vixi, putem cheltui o parte, dar este bine să păstrăm și pentru lucrurile importante. Asta înseamnă să economisim.'},{who:'Nuci',text:'Eu strâng câte puțin pentru o bicicletă! Fiecare monedă economisită mă apropie de visul meu.'},{who:'Vixi',text:'Atunci voi păstra și eu câteva monede pentru mai târziu!'},{who:'Bani',text:'Foarte bine! Aici vom învăța prin povești și jocuri cum să facem alegeri înțelepte. Tu ești pregătit să începi aventura?'}];let i=0,started=false,finished=false,serial=0;const frame=document.getElementById('frame'),who=document.getElementById('who'),line=document.getElementById('line'),status=document.getElementById('status'),go=document.getElementById('go');function show(){who.textContent=story[i].who;line.textContent=story[i].text;if(i>=3)frame.classList.add('story')}function finish(){finished=true;go.classList.remove('hidden');status.textContent=''}function next(){if(finished)return;if(i===story.length-1){finish();return}i++;play()}function play(){show();const id=++serial;if(!('speechSynthesis' in window)){status.textContent='Vocea nu este disponibilă pe acest dispozitiv.';return}let u=new SpeechSynthesisUtterance(story[i].text);u.lang='ro-RO';u.rate=.88;u.pitch=story[i].who==='Vixi'?1.18:story[i].who==='Nuci'?1.1:.96;u.onstart=()=>{if(id===serial)status.textContent=''};u.onend=()=>{if(id===serial)setTimeout(()=>{if(id===serial)next()},450)};u.onerror=()=>{if(id===serial){started=false;status.textContent='Atinge imaginea pentru a continua povestea cu sunet.'}};try{speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){started=false;status.textContent='Atinge imaginea pentru a activa vocea.'}}function begin(){if(finished||started)return;started=true;status.textContent='';play()}frame.addEventListener('click',begin);document.querySelector('.caption').addEventListener('click',begin);show()})();</script></body></html>
