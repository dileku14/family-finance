<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bani · Nivelul 1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#194832;color:white;font-family:system-ui,-apple-system,sans-serif}
.game{width:min(100%,600px);margin:auto;min-height:100dvh;padding:14px 12px 24px;display:flex;flex-direction:column;align-items:center;gap:15px}
.header{width:100%;display:flex;justify-content:space-between;align-items:center;color:#ffe5a1;font-size:19px;font-weight:800}
.stage{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:22px}
.scene{display:block;width:100%;height:100%;object-fit:contain}
.tap-owl{position:absolute;left:20%;top:19%;width:60%;height:52%;border:0;background:transparent;cursor:pointer}
.choices{position:absolute;left:4%;right:4%;top:76%;height:19%;display:grid;grid-template-columns:1fr 1fr;gap:3%;z-index:5}
.choices button{border:0;background:transparent;cursor:pointer;touch-action:manipulation;border-radius:20px;-webkit-tap-highlight-color:transparent}
.choices button:focus-visible,.tap-owl:focus-visible{outline:3px solid #fff}
.choices button:disabled{cursor:default}
.progress{display:flex;gap:7px;justify-content:center;margin:10px 0 0}
.progress span{font-size:clamp(24px,7vw,35px);filter:grayscale(1);opacity:.35}
.progress span.earned{filter:none;opacity:1}
.flying{position:fixed;z-index:30;font-size:96px;pointer-events:none;transition:transform 1s ease-in,opacity 1s}
.finish{position:absolute;inset:0;background:#18543ff2;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.finish a{background:#ffe27a;color:#25482d;padding:15px 20px;border-radius:20px;font-size:20px;font-weight:800;text-decoration:none}
.hidden{display:none!important}
</style></head><body><main class="game">
<div class="header" id="header"><span>🦉 Nivelul 1</span><span id="count">1 / 6</span></div>
<div class="stage" id="stage">
<img class="scene" id="scene" src="./D1CAE969-BA46-4427-B331-2B2187BD85C8.png" alt="Bani ține un coș cu pâine">
<button class="tap-owl" id="repeat" aria-label="Ascultă întrebarea din nou"></button>
<div class="choices" id="choices"><button type="button" data-answer="nevoie" aria-label="Nevoie"></button><button type="button" data-answer="dorinta" aria-label="Dorință"></button></div>
<div class="finish hidden" id="finish"><div style="font-size:65px">🌟</div><strong style="font-size:29px">Bravo! Ai terminat!</strong><a href="./academia.html">Continuă aventura →</a></div>
</div>
<div class="progress" id="progress" aria-label="Steluțe câștigate"><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span></div>
</main>
<script>
(()=>{
const bread='./D1CAE969-BA46-4427-B331-2B2187BD85C8.png';
const teddy='./a_bright_colorful_3d_cgi_cartoon_style_education.png';
const questions=[
{image:bread,name:'pâinea',answer:'nevoie',alt:'Bani cu un coș de pâine'},
{image:teddy,name:'ursulețul de pluș',answer:'dorinta',alt:'Bani cu un ursuleț de pluș'},
{image:bread,name:'apa',answer:'nevoie',alt:'Bani'},
{image:bread,name:'jocul',answer:'dorinta',alt:'Bani'},
{image:bread,name:'haina groasă',answer:'nevoie',alt:'Bani'},
{image:bread,name:'bomboanele',answer:'dorinta',alt:'Bani'}];
let index=0,locked=false;
const scene=document.getElementById('scene'),header=document.getElementById('header');
const buttons=[...document.querySelectorAll('[data-answer]')];
const stars=[...document.querySelectorAll('#progress span')];
function speak(t){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ro-RO';u.rate=.9;window.speechSynthesis.speak(u)}
function ask(){speak('Spune-mi, micule aventurier, '+questions[index].name+' este o nevoie sau o dorință?')}
function show(){locked=false;const q=questions[index];scene.src=q.image;scene.alt=q.alt;document.getElementById('count').textContent=(index+1)+' / 6';header.classList.toggle('hidden',index===1);buttons.forEach(b=>b.disabled=false)}
function fly(n){const target=stars[n].getBoundingClientRect();const el=document.createElement('div');el.className='flying';el.textContent='⭐';el.style.left='calc(50% - 48px)';el.style.top='38%';document.body.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>{const r=el.getBoundingClientRect();el.style.transform='translate('+(target.left+target.width/2-r.left-r.width/2)+'px,'+(target.top+target.height/2-r.top-r.height/2)+'px) scale(.3)';el.style.opacity='.5'}));setTimeout(()=>el.remove(),1150)}
function choose(answer){if(locked)return;if(answer!==questions[index].answer){speak('Mmm... Eu zic să mai încerci o dată.');return}
locked=true;buttons.forEach(b=>b.disabled=true);stars[index].classList.add('earned');fly(index);speak('Bravo! Ai ales corect!');
setTimeout(()=>{index++;if(index===questions.length){document.getElementById('finish').classList.remove('hidden');speak('Felicitări! Ai terminat prima misiune!');return}show();ask()},1800)}
buttons.forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();choose(b.dataset.answer)}));
document.getElementById('repeat').addEventListener('click',e=>{e.stopPropagation();if(!locked)ask()});
show();
})();
</script></body></html>
