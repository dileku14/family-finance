<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bani · Nivelul 1</title><style>*{box-sizing:border-box}body{margin:0;background:#1c4731;font-family:system-ui,-apple-system,sans-serif;color:white}.game{max-width:600px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:12px;gap:12px}.top{display:flex;justify-content:space-between;font-weight:800;color:#f8e3a3;font-size:16px}.stage{position:relative;flex:1;min-height:340px;border-radius:26px;overflow:hidden;border:3px solid #d7b56c;background:radial-gradient(circle at 50% 25%,#b6dba6,#4a9473 75%)}.bani{position:absolute;width:100%;height:100%;object-fit:cover;object-position:left center;transform:scale(1.9);transform-origin:18% 48%}.item{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:clamp(74px,23vw,120px);filter:drop-shadow(0 8px 5px #0005);z-index:2;animation:pop .5s ease-out}.happy{position:absolute;right:3%;top:44%;font-size:clamp(65px,22vw,105px);z-index:3;animation:jump .6s ease-in-out infinite alternate;filter:drop-shadow(0 6px 4px #0005)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{font:900 clamp(18px,5vw,25px) system-ui;border:3px solid #fff9d6;border-radius:22px;padding:19px 8px;color:#284a31;background:#f9ce6a;box-shadow:0 5px 0 #9b7127}.choices button:last-child{background:#9ce5ab;box-shadow:0 5px 0 #4e985d}.choices button:disabled{opacity:.65}.bottom{height:38px;text-align:center;font-size:14px;color:#e4f2e0}.hidden{display:none!important}.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1e5a40ec;text-align:center;z-index:5;padding:24px}.done h2{font-size:30px}.done a{background:#72d65a;padding:18px;border-radius:20px;color:#123e23;font-size:21px;font-weight:900;text-decoration:none}@keyframes jump{to{transform:translateY(-28px) rotate(9deg)}}@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.3)}to{opacity:1;transform:translateX(-50%) scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="game"><div class="top"><span>🦉 Nivelul 1</span><span id="counter">1 / 6</span><span id="stars">⭐ 0</span></div><div class="stage" id="stage"><img class="bani" src="./personaje-3d.png" alt="Bani"><div class="item" id="item">🥖</div><div id="happy" class="happy hidden" aria-label="Animăluț fericit">🐿️🎉</div><div id="done" class="done hidden"><div style="font-size:70px">🎉🦉</div><h2>Bravo!</h2><p>Ai terminat prima misiune!</p><a href="./academia.html">Continuă aventura →</a></div></div><div class="choices" id="choices"><button data-answer="nevoie">🏡 Nevoie</button><button data-answer="dorinta">✨ Dorință</button></div><div class="bottom" id="hint">Atinge un răspuns</div></main><script>(()=>{const data=[['🥖','nevoie','pâinea'],['🧸','dorinta','ursulețul'],['💧','nevoie','apa'],['🎮','dorinta','jocul'],['🧥','nevoie','haina groasă'],['🍭','dorinta','bomboanele']];let i=0,score=0,busy=false;const item=document.getElementById('item'),happy=document.getElementById('happy'),hint=document.getElementById('hint'),buttons=[...document.querySelectorAll('[data-answer]')];function say(t){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ro-RO';u.rate=.93;speechSynthesis.speak(u)}catch(e){}}function show(){busy=false;item.textContent=data[i][0];happy.classList.add('hidden');hint.textContent='';buttons.forEach(b=>b.disabled=false);document.getElementById('counter').textContent=(i+1)+' / '+data.length;document.getElementById('stars').textContent='⭐ '+score}function advance(){i++;if(i>=data.length){document.getElementById('done').classList.remove('hidden');document.getElementById('choices').classList.add('hidden');hint.textContent='';say('Felicitări! Ai terminat prima misiune!')}else{show();say('Privește! '+data[i][2]+'. Nevoie sau dorință?')}}buttons.forEach(b=>b.addEventListener('click',()=>{if(busy)return;const correct=b.dataset.answer===data[i][1];if(!correct){hint.textContent='Mai încearcă! 💛';say('Mai încearcă!');return}busy=true;score++;buttons.forEach(x=>x.disabled=true);happy.classList.remove('hidden');hint.textContent='';say('Bravo! Ai ales corect!');setTimeout(advance,1900)}));document.getElementById('stage').addEventListener('click',()=>{if(!busy&&i<data.length)say('Privește! '+data[i][2]+'. Nevoie sau dorință?')});show()})();</script></body></html>
