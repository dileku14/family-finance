<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bani · Nivelul 1</title><style>*{box-sizing:border-box}body{margin:0;background:#1c4731;font-family:system-ui,-apple-system,sans-serif;color:white}.game{max-width:600px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:12px;gap:12px}.top{display:flex;justify-content:space-between;font-weight:800;color:#f8e3a3;font-size:16px}.stage{position:relative;flex:none;aspect-ratio:1/1;min-height:0;border-radius:26px;overflow:hidden;border:3px solid #d7b56c;background:radial-gradient(circle at 50% 25%,#b6dba6,#4a9473 75%)}.bani{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;animation:float 3s ease-in-out infinite alternate}.item{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:clamp(74px,23vw,120px);filter:drop-shadow(0 8px 5px #0005);z-index:2;animation:pop .5s ease-out}.happy{position:absolute;right:3%;bottom:3%;font-size:clamp(65px,22vw,105px);z-index:3;animation:jump .6s ease-in-out infinite alternate;filter:drop-shadow(0 6px 4px #0005)}.choices{position:absolute;left:17%;right:17%;top:75%;height:11%;z-index:4;display:grid;grid-template-columns:1fr 1fr;gap:4%}.choices button{appearance:none;border:0;background:transparent!important;box-shadow:none!important;border-radius:20px;padding:0;color:transparent;cursor:pointer;touch-action:manipulation}.choices button:disabled{opacity:.65}.bottom{height:62px;text-align:center;font-size:14px;color:#e4f2e0;display:flex;justify-content:center;align-items:center;gap:8px}.progress-star{font-size:25px;opacity:.35}.progress-star.earned{opacity:1}.flying-star{position:fixed;z-index:50;font-size:110px;pointer-events:none;transition:transform 1.1s cubic-bezier(.2,.7,.25,1),opacity 1.1s;filter:drop-shadow(0 7px 12px #0005)}.hidden{display:none!important}.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1e5a40ec;text-align:center;z-index:5;padding:24px}.done h2{font-size:30px}.done a{background:#72d65a;padding:18px;border-radius:20px;color:#123e23;font-size:21px;font-weight:900;text-decoration:none}@keyframes float{to{transform:translateY(-5px)}}@keyframes jump{to{transform:translateY(-28px) rotate(9deg)}}@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.3)}to{opacity:1;transform:translateX(-50%) scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="game"><div class="top"><span>🦉 Nivelul 1</span><span id="counter">1 / 6</span><span id="stars">⭐ 0</span></div><div class="stage" id="stage"><img class="bani" id="sceneImage" src="./D1CAE969-BA46-4427-B331-2B2187BD85C8.png" alt="Bani"><div class="item hidden" id="item">🥖</div><div class="choices" id="choices"><button data-answer="nevoie" aria-label="Nevoie"></button><button data-answer="dorinta" aria-label="Dorință"></button></div><div id="done" class="done hidden"><div style="font-size:70px">🎉🦉</div><h2>Bravo!</h2><p>Ai terminat prima misiune!</p><a href="./academia.html">Continuă aventura →</a></div></div><div class="bottom" id="hint" aria-label="Progresul nivelului"><span class="progress-star">⭐</span><span class="progress-star">⭐</span><span class="progress-star">⭐</span><span class="progress-star">⭐</span><span class="progress-star">⭐</span><span class="progress-star">⭐</span></div></main><script>(()=>{const data=[['🥖','nevoie','pâinea'],['🧸','dorinta','ursulețul de pluș'],['💧','nevoie','apa'],['🎮','dorinta','jocul'],['🧥','nevoie','haina groasă'],['🍭','dorinta','bomboanele']];let i=0,score=0,busy=false;const sceneImage=document.getElementById('sceneImage'),item=document.getElementById('item'),hint=document.getElementById('hint'),buttons=[...document.querySelectorAll('[data-answer]')];function say(t){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ro-RO';u.rate=.93;speechSynthesis.speak(u)}catch(e){}}function show(){busy=false;sceneImage.src=i===1?'./a_bright_colorful_3d_cgi_cartoon_style_education.png':'./D1CAE969-BA46-4427-B331-2B2187BD85C8.png';item.textContent=data[i][0];item.classList.toggle('hidden',i===0||i===1);buttons.forEach(b=>b.disabled=false);document.getElementById('counter').textContent=(i+1)+' / '+data.length;void score}function flyStar(index){const target=document.querySelectorAll('.progress-star')[index].getBoundingClientRect();const star=document.createElement('div');star.className='flying-star';star.textContent='⭐';star.style.left='calc(50% - 55px)';star.style.top='calc(42% - 55px)';document.body.appendChild(star);requestAnimationFrame(()=>requestAnimationFrame(()=>{const r=star.getBoundingClientRect();star.style.transform='translate('+(target.left+target.width/2-r.left-r.width/2)+'px,'+(target.top+target.height/2-r.top-r.height/2)+'px) scale(.22)';star.style.opacity='.8'}));setTimeout(()=>star.remove(),1250)}function advance(){i++;if(i>=data.length){document.getElementById('done').classList.remove('hidden');document.getElementById('choices').classList.add('hidden');say('Felicitări! Ai terminat prima misiune!')}else{show();say('Spune-mi, micule aventurier, '+data[i][2]+' este o nevoie sau o dorință?')}}buttons.forEach(b=>b.addEventListener('click',()=>{if(busy)return;const correct=b.dataset.answer===data[i][1];if(!correct){say('Mmm... Eu zic să mai încerci o dată.');return}busy=true;score++;buttons.forEach(x=>x.disabled=true);document.querySelectorAll('.progress-star')[i].classList.add('earned');flyStar(i);say('Bravo! Ai ales corect!');setTimeout(advance,1900)}));document.getElementById('stage').addEventListener('click',()=>{if(!busy&&i<data.length)say('Spune-mi, micule aventurier, '+data[i][2]+' este o nevoie sau o dorință?')});show();document.querySelector('.choices').addEventListener('pointerdown',()=>{}, {passive:true});})();</script></body></html>
