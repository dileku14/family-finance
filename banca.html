<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumea 4 — Banca lui Bani</title><style>:root{font-family:system-ui,sans-serif;color:#17352e;background:#f4f6f1}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:18px}header{background:#102e28;color:white;padding:25px 18px}header a{color:white}.card{background:white;border:1px solid #dce6de;border-radius:20px;padding:20px;margin:15px 0}.scene{text-align:center;background:#e5f2df;border-radius:20px;padding:22px}.emoji{font-size:60px}.choice{display:block;width:100%;margin:10px 0;padding:15px;border:1px solid #b8d1c1;border-radius:12px;background:white;text-align:left;font:inherit;color:#17352e}.choice:disabled{opacity:.65}.btn{padding:13px 18px;border:0;border-radius:12px;background:#19654e;color:white;font:inherit;font-weight:bold}.hidden{display:none}.feedback{background:#fff4d8;border-radius:12px;padding:12px}.ok{background:#e2f4e5}</style></head><body><header><a href="./academia.html">← Înapoi la Academia Banilor</a><h1>🦉 Lumea 4 · Banca lui Bani</h1><p>Respectă banul ca să primești același respect.</p></header><main><p>Învață să păstrezi banii în siguranță. Nu introduce date bancare reale.</p><div class="scene"><div class="emoji">🦉🏦</div><h2 id="step"></h2><div id="stars"></div></div><div class="card"><h2 id="question"></h2><div id="choices"></div><p id="feedback" class="feedback hidden" role="status"></p><button id="next" class="btn hidden">Continuă →</button></div><p>Nu pierzi stele dacă răspunzi greșit. Totul este educațional și gratuit.</p></main><script>'use strict';const KEY='ff_academia_demo_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{state={}}const $=id=>document.getElementById(id);const qs=[{q:'🏦 Unde este mai sigur să păstrezi economiile familiei?',a:['La vedere, pe o bancă în parc','Într-un loc sigur, ales cu un adult de încredere','În buzunarul unei haine lăsate afară'],correct:1,why:'Un adult de încredere te poate ajuta să alegi un loc sigur.'},{q:'🔐 Cineva îți cere codul PIN al cardului familiei. Ce faci?',a:['Spun codul PIN persoanei respective','Îl scriu într-un mesaj','Nu îl spun și anunț un adult de încredere'],correct:2,why:'PIN-ul este secret. Nu îl introduce niciodată în acest joc.'},{q:'🎁 Un mesaj promite un premiu dacă trimiți parola. Ce faci?',a:['Trimit parola','Nu trimit date și arăt mesajul unui adult de încredere','Trimit și PIN-ul'],correct:1,why:'Mesajul poate fi o înșelătorie. Nu trimite parole sau PIN-uri.'}];const done=()=>Math.max(0,Math.min(3,Number(state.bankDone)||0));let phase=done();function draw(){$('stars').textContent='⭐'.repeat(done())+'☆'.repeat(3-done());$('feedback').classList.add('hidden');$('choices').replaceChildren();$('next').classList.add('hidden');if(phase===3){$('step').textContent='Lume finalizată';$('question').textContent='🏆 Ai câștigat 3 stele!';$('choices').textContent='Ai învățat să îți protejezi banii, codul PIN și datele personale. Bravo!';$('next').textContent='Joacă din nou';$('next').classList.remove('hidden');$('next').onclick=()=>{phase=0;draw()};return}const q=qs[phase];$('step').textContent='Provocarea '+(phase+1)+' din 3';$('question').textContent=q.q;q.a.forEach((a,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=a;b.onclick=()=>{const ok=i===q.correct;$('feedback').classList.remove('hidden');$('feedback').classList.toggle('ok',ok);$('feedback').textContent=(ok?'✅ Corect! ':'💡 Încearcă din nou. ')+q.why;if(ok){$('choices').querySelectorAll('button').forEach(x=>x.disabled=true);const n=phase+1;if(done()<n){state.bankDone=n;try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}$('stars').textContent='⭐'.repeat(done())+'☆'.repeat(3-done());$('next').textContent=n===3?'Vezi recompensa 🏆':'Continuă →';$('next').classList.remove('hidden');$('next').onclick=()=>{phase=n;draw()}}};$('choices').appendChild(b)})}draw();</script></body></html>
